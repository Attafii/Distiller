            - paragraph [ref=f1e21]: Built because staying informed shouldn't cost you 2 hours a day.
          - generic [ref=f1e22]:
            - paragraph [ref=f1e23]: "Distiller started as a personal frustration. Every morning meant the same ritual: opening fifteen browser tabs, skimming headlines, losing 90 minutes to context-switching before getting to actual work. The world produces more news than any human can reasonably process — and most of it is noise."
            - paragraph [ref=f1e24]: "The idea is simple: what if an AI could read everything, distill it down to exactly what matters, and present it in a format you can scan in 60 seconds? Three bullets. One insight. A clear conclusion. No padding, no speculation, no filler."
            - paragraph [ref=f1e25]: Every brief is grounded in the original source text using RAG and NVIDIA embeddings, so you always know what's real and what the model inferred. Citations aren't decorative — they're the foundation.
            - paragraph [ref=f1e26]: The product is still young. We cover 15 topics across 15 regions, with a free tier that gives you 50 articles per month. The goal isn't to replace your news diet — it's to make sure the time you spend on it is actually worth it.
